name: Deploy landing page to GitHub Pages

# The playable game is deployed on Vercel (production). GitHub Pages serves the
# marketing/landing page in landing/, which links out to the Vercel build.
on:
  # 한글판에서는 게임(pages.yml)이 Pages에 배포되므로, 랜딩 페이지 자동 배포가
  # 게임 사이트를 덮어쓰지 않도록 push 트리거는 끕니다. 필요 시 수동 실행만 합니다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing
      - id: deployment
        uses: actions/deploy-pages@v4
